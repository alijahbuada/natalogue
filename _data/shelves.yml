# ============================================================
#  natalogue · shelves
#  Two shelves: "currently" (what you're in the middle of) and
#  "favorites" (the keepers). Each item starts with a dash.
#
#  title:    required
#  type:     book, show, film, music, game, podcast, or other
#  by:       author / creator / studio (optional)
#  progress: how far along you are, like "ep 4 of 12" (optional, currently only)
#  note:     a line about it, in your words (optional)
#
#  The items below are samples. Replace them with your own.
# ============================================================

currently:
  - title: the book on your nightstand
    type: book
    by: its author
    progress: page 112
    note: a line about why you picked it up
  - title: the show you're halfway through
    type: show
    by: who made it
    progress: season 1, ep 6
    note: who you're watching it with, or what it reminds you of
  - title: the next one in the stack
    type: book
    by: its author
    progress: just started

favorites:
  - title: a book you'd press into a friend's hands
    type: book
    by: its author
    note: the reason, in one sentence
  - title: a show you rewatch when you need it
    type: show
    by: who made it
    note: the episode you'd start with
  - title: a film that rearranged something
    type: film
    by: its director
  - title: an album that soundtracked a year
    type: music
    by: the artist
