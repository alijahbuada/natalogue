---
layout: page
title: gallery
permalink: /gallery/
intro: Crochet pieces and other things made by hand.
---
{% if site.data.gallery.size > 0 %}
  <ul class="gallery">
    {% for piece in site.data.gallery %}
      <li class="piece">
        <figure>
          {% if piece.image contains "/" %}{% assign img = piece.image %}{% else %}{% assign img = piece.image | prepend: '/assets/img/gallery/' %}{% endif %}
          <img src="{{ img | relative_url }}" alt="{{ piece.alt | default: piece.title }}" loading="lazy">
          <figcaption>
            <span class="piece-title">{{ piece.title }}</span>
            {% if piece.note %}<span class="piece-note">{{ piece.note }}</span>{% endif %}
          </figcaption>
        </figure>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p class="empty">Pieces are still on the hook. The first ones go up soon.</p>
{% endif %}
