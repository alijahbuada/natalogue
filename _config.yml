# ============================================================
#  natalogue · site plumbing
#  Nat: you don't need this file. Your settings (tagline, links,
#  playlist, lace words, gallery switch) live in the editor under
#  "Site settings", or in _data/settings.yml.
# ============================================================

title: natalogue

url: "https://nnonacf.github.io"   # test host; change when it moves to Nat
baseurl: "/natalogue"   # repo name; set to "" if the repo is <username>.github.io

future: true      # entries dated later today (time zones!) still publish

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

collections:
  entries:
    output: true
    permalink: /entries/:title/

defaults:
  - scope:
      path: ""
      type: entries
    values:
      layout: entry

media_types: [book, show, film, music, game, podcast, other]

exclude:
  - README.md
  - HOW-TO-EDIT.md
  - templates/
  - tools/
  - Gemfile
  - Gemfile.lock
